<!doctype html>
<html lang="en" data-theme="retro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Daisy UI CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Daisy UI Themes -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>

  <body class="flex flex-col items-center">
    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-sm">
      <div class="navbar-start">
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h7"
              />
            </svg>
          </div>
          <ul
            tabindex="-1"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
          >
            <li><a href="#go-to-appitizers">Appitizers</a></li>
            <li><a href="#go-to-main">Main</a></li>
            <li><a href="#go-to-drinks">Drinks</a></li>
            <li><a href="#go-to-desserts">Desserts</a></li>
          </ul>
        </div>
      </div>
      <div class="navbar-center">
        <a class="btn btn-ghost text-xl">Menu</a>
      </div>
      <div class="navbar-end pe-2">
        <label class="swap swap-rotate">
          <!-- this hidden checkbox controls the state -->
          <input type="checkbox" class="theme-controller" value="coffee" />

          <!-- sun icon -->
          <svg
            class="swap-off h-10 w-10 fill-current"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"
            />
          </svg>

          <!-- moon icon -->
          <svg
            class="swap-on h-10 w-10 fill-current"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"
            />
          </svg>
        </label>
      </div>
    </div>

    <!-- Banner -->
    <div class="mt-8 mx-4 aura aura-gold">
      <div class="card bg-base-200 w-full justify-center h-25">
        <div class="card-body">
          <h2 class="card-title">A Taste Worth Savoring</h2>
          <p>
            Thoughtfully crafted dishes, made with care — because comfort should
            never feel ordinary.
          </p>
        </div>
      </div>
    </div>

    <!-- Menu -->
    <main class="py-5 px-10">
      <!-- Appitizers -->
      <h2 id="go-to-appitizers" class="text-4xl pb-8 font-bold text-center">
        Appitizers
      </h2>
      <div
        id="appetizers"
        class="gap-8 md:grid lg:grid-cols-4 md:grid-cols-2 sm:grid-cols-1 hidden"
      ></div>
      <ul
        id="appetizers-list"
        class="md:hidden list bg-base-300 rounded-box shadow-md"
      ></ul>

      <!-- Main -->
      <h2 id="go-to-main" class="text-4xl py-8 font-bold text-center">Main</h2>
      <div
        id="main"
        class="gap-8 md:grid lg:grid-cols-4 md:grid-cols-2 sm:grid-cols-1 hidden"
      ></div>
      <ul
        id="main-list"
        class="md:hidden list bg-base-300 rounded-box shadow-md"
      ></ul>

      <!-- Drinks -->
      <h2 id="go-to-drinks" class="text-4xl py-8 font-bold text-center">
        Drinks
      </h2>
      <div
        id="drinks"
        class="gap-8 md:grid lg:grid-cols-4 md:grid-cols-2 sm:grid-cols-1 hidden"
      ></div>
      <ul
        id="drinks-list"
        class="md:hidden list bg-base-300 rounded-box shadow-md"
      ></ul>

      <!-- Desserts -->
      <h2 id="go-to-desserts" class="text-4xl py-8 font-bold text-center">
        Desserts
      </h2>
      <div
        id="desserts"
        class="gap-8 md:grid lg:grid-cols-4 md:grid-cols-2 sm:grid-cols-1 hidden"
      ></div>
      <ul
        id="desserts-list"
        class="md:hidden list bg-base-300 rounded-box shadow-md"
      ></ul>
    </main>

    <!-- Footer -->
    <footer
      class="footer relative bottom-0 sm:footer-horizontal footer-center bg-base-100 text-base-content p-4"
    >
      <aside>
        <p>Menu © 2026 - All right reserved by Mustafa</p>
      </aside>
    </footer>

    <script>
      const themeCheckbox = document.querySelector(".theme-controller");

      const savedTheme = localStorage.getItem("theme");

      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);

        themeCheckbox.checked = savedTheme === "coffee";
      }

      themeCheckbox.addEventListener("change", function () {
        const newTheme = themeCheckbox.checked ? "coffee" : "retro";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
      });

      async function renderDishesAsList(lists, containerId) {
        let listHTML = "";

        lists.forEach(function (dish) {
          listHTML += `
            <li class="list-row">
              <div class="text-4xl font-thin opacity-30 tabular-nums">${dish.id}</div>
              <div>
                <img
                  class="size-10 rounded-box object-cover"
                  alt="${dish.name}"
                  src="${dish.image}"
                />
              </div>
              <div class="list-col-grow">
                <div>${dish.name}</div>
                <div class="text-xs uppercase font-semibold opacity-60">
                  ${dish.description}
                </div>
              </div>
              <div class="badge badge-primary">$${dish.price}</div>
            </li>
          `;
        });

        document.querySelector(containerId).innerHTML = listHTML;
      }

      async function renderDishes(dishes, containerId) {
        let cardsHTML = "";

        dishes.forEach(function (dish) {
          cardsHTML += `
            <div
              class="card bg-base-300 shadow-lg hover:shadow-2xl transition-shadow duration-400"
            >
              <figure>
                <img
                  src="${dish.image}"
                  alt="${dish.name}"
                  title="${dish.name}"
                  class="object-cover w-150 h-48"
                />
              </figure>
              <div class="card-body">
                <h2 class="card-title">
                  ${dish.name}
                  <div class="badge badge-primary">$${dish.price}</div>
                </h2>
                <p>
                  ${dish.description}
                </p>
                ${
                  dish.extra
                    ? `
                      <div class="card-actions justify-end">
                        <div class="badge badge-outline">
                          ${dish.extra}
                        </div>
                      </div>
                      `
                    : ""
                }
              </div>
            </div>
          `;
        });

        document.querySelector(containerId).innerHTML = cardsHTML;
      }

      async function loadMenu() {
        let skeletonHTML = "";

        for (let i = 0; i < 4; i++) {
          skeletonHTML += `
            <div
              class="card bg-base-200 shadow-lg hover:shadow-2xl transition-shadow duration-400"
            >
              <figure>
                <div class="skeleton w-150 h-48"></div>
              </figure>
              <div class="card-body">
                <div class="skeleton h-4 w-28"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-full"></div>
              </div>
            </div>
          `;
        }

        document.querySelector("#appetizers").innerHTML = skeletonHTML;
        document.querySelector("#main").innerHTML = skeletonHTML;
        document.querySelector("#drinks").innerHTML = skeletonHTML;
        document.querySelector("#desserts").innerHTML = skeletonHTML;

        const response = await fetch("menu.json");
        const menuData = await response.json();

        renderDishesAsList(menuData.appetizers, "#appetizers-list");
        renderDishesAsList(menuData.main, "#main-list");
        renderDishesAsList(menuData.drinks, "#drinks-list");
        renderDishesAsList(menuData.desserts, "#desserts-list");

        renderDishes(menuData.appetizers, "#appetizers");
        renderDishes(menuData.main, "#main");
        renderDishes(menuData.drinks, "#drinks");
        renderDishes(menuData.desserts, "#desserts");
      }

      loadMenu();
    </script>
  </body>
</html>
